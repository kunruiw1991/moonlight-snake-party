<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171c35"><title>星月贪吃蛇派对</title><link rel="stylesheet" href="style.css?v=1"></head><body>
<main class="app">
<header><div class="badge">🐍<span>🌙</span></div><div class="score" aria-label="得分">🥮 <b id="score">0</b></div><div class="progress" aria-label="收集目标"><div id="stars">☆ ☆ ☆</div><div class="track"><i id="progress"></i></div></div><div class="actions"><button id="nextSong" aria-label="换歌">⏭</button><button id="sound" aria-label="关闭音乐">🔊</button><button id="pause" aria-label="暂停" disabled>⏸</button></div></header>
<div class="play-layout"><section class="board" aria-label="贪吃蛇场地"><canvas id="canvas" width="900" height="720" aria-label="滑动手指或按方向按钮控制贪吃蛇"></canvas><div id="pop" aria-live="polite"></div><div id="overlay" class="overlay"><div class="menu">
<div id="hero" class="hero" aria-hidden="true">🐍<span>✨</span></div><div id="pickers"><div id="characters" class="characters" role="group" aria-label="选择角色"></div><div class="choices"><div id="worlds" role="group" aria-label="选择场景"><button class="selected" data-world="0" aria-label="月宫" aria-pressed="true">🌕</button><button data-world="1" aria-label="桂花花园" aria-pressed="false">🌳</button><button data-world="2" aria-label="星河" aria-pressed="false">🌌</button></div><div id="modes" role="group" aria-label="选择难度"><button class="selected" data-gentle="true" aria-label="轻松模式" aria-pressed="true">🐣</button><button data-gentle="false" aria-label="挑战模式" aria-pressed="false">🔥</button></div></div></div>
<div id="result" hidden><div id="resultStars">⭐ ⭐ ⭐</div><div class="result-score">🥮 <b id="resultScore">0</b></div><div id="resultFriends"></div></div>
<div class="menu-actions"><button id="play" class="play" aria-label="开始游戏">▶</button><button id="home" aria-label="返回角色选择" hidden>🏠</button></div><div id="hint" class="hint" aria-hidden="true">👆 <span>→</span> 🥮</div></div></div></section>
<aside class="controller"><div id="hearts" class="hearts" aria-label="生命">❤️❤️❤️</div><div class="pad" role="group" aria-label="方向控制"><button data-dir="up" class="up" aria-label="向上">▲</button><button data-dir="left" class="left" aria-label="向左">◀</button><div class="pad-center">✦</div><button data-dir="right" class="right" aria-label="向右">▶</button><button data-dir="down" class="down" aria-label="向下">▼</button></div><button id="bubble" class="bubble" aria-label="泡泡护盾，减慢速度" disabled>🫧</button><div id="buffs" aria-label="道具状态"></div><div id="friends" class="friends" aria-label="收集的伙伴"></div></aside></div>
<audio id="music" preload="none" playsinline></audio></main><script type="module" src="app.mjs?v=2"></script></body></html>
